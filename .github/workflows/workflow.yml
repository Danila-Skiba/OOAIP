name: CI

on:
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check file endings
        run: |
          # Исключаем файлы, которые не нужно проверять
          EXCLUDED_FILES="README.md\|.gitignore\|*.json\|*.yml\|*.yaml\|.github/workflows/workflow.yml\|.editorconfig"

          # Находим все текстовые файлы, исключая указанные
          FILES=$(git grep --cached -Il '' | grep -v "$EXCLUDED_FILES")

          # Проверяем, что каждый файл заканчивается пустой строкой
          for file in $FILES; do
            if ! tail -n 1 "$file" | cat -e | grep -q '^\$$'; then
              echo "Файл $file не заканчивается пустой строкой"
              exit 1
            fi
          done

          echo "Все файлы заканчиваются пустой строкой"

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SpaceBattle/SpaceBattle.Lib.Tests

      - name: Install Required Tools
        run: |
          dotnet new tool-manifest
          dotnet tool install dotnet-coverage
          dotnet tool install coverlet.console

      - name: Build
        run: dotnet build SpaceBattle/SpaceBattle.Lib --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: cd SpaceBattle/SpaceBattle.Lib.Tests/ &&  dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura

      - name: Coverage and Tests
        run: |
          cd SpaceBattle/SpaceBattle.Lib.Tests/
          dotnet coverlet bin/Debug/net8.0/SpaceBattle.Lib.Tests.dll --target "dotnet" --targetargs "test --no-build" -f=opencover -o="coverage.xml"
